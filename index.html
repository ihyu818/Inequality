<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>不等式綜合練習</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --fg: #1d2433; --mute: #667085;
    --line: #d5d9e3; --ok: #13795b; --bad: #c0392b; --acc: #3b5bdb; --key: #eceff6;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b2030; --fg: #e8ebf3; --mute: #9aa3b5;
      --line: #343b50; --ok: #4cc9a0; --bad: #ff7b6b; --acc: #8fa5ff; --key: #2a3148;
    }
  }
  *, *::before, *::after { box-sizing: border-box !important; }
  html { height: 100%; }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.6; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  main {
    width: 100% !important; max-width: 600px; margin: 0 auto; padding: 12px;
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 20px; margin-bottom: 12px; position: relative;
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .score { color: var(--mute); font-size: 0.9rem; margin: 0; }
  .qcard { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; }
  .question-latex { font-size: 1.5rem; margin-bottom: 16px; }
  
  /* 輸入顯示區 */
  .input-display {
    width: 100%; min-height: 48px; border: 2px solid var(--acc); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-family: "Times New Roman", Times, serif; font-style: italic;
    letter-spacing: 2px; background: var(--bg); padding: 8px; overflow-x: auto;
  }
  
  #msg { margin-top: 12px; font-weight: bold; font-size: 1rem; text-align: center; min-height: 1.5em; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }

  /* 虛擬鍵盤 */
  .pad {
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: clamp(40px, 8dvh, 56px); gap: 6px; width: 100%; margin-top: auto;
  }
  .pad button {
    background: var(--key); border: 1px solid var(--line); border-radius: 10px;
    color: var(--fg); font-size: 1.25rem; font-weight: bold; cursor: pointer;
    font-family: inherit; transition: background 0.1s; user-select: none;
  }
  .pad button:active { background: var(--line); }
  .pad button.action { background: var(--acc); color: #fff; border-color: var(--acc); }
  .pad button.action:active { filter: brightness(0.9); }
  .pad button.enter { grid-column: span 4; }
  
  .katex { font-size: 1.15em; }
</style>
</head>
<body>

<main>
  <div class="card head">
    <h1>不等式綜合練習</h1>
    <p class="score" id="score">答對 0 / 已作答 0</p>
  </div>

  <div class="card qcard">
    <div class="question-latex" id="question-display"></div>
    <div class="input-display" id="input-display"></div>
    <div id="msg"></div>
  </div>

  <div class="pad" id="pad">
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="back" class="action" aria-label="退格">⌫</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="/">/</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="-">−</button>
    <button data-k="0">0</button><button data-k="x">x</button><button data-k=">">></button><button data-k="<"><</button>
    <button data-k="≧">≧</button><button data-k="≦">≦</button><button data-k="或">或</button><button data-k="且">且</button>
    <button data-k="enter" class="action enter">確認送出 / 下一題 (Enter)</button>
  </div>
</main>

<script>
// --- 核心邏輯與常數 ---
const ops = ['>', '<', '≧', '≦'];
const latexOps = ['>', '<', '\\geqq', '\\leqq'];
let currentValidAnswers = [];
let isDone = false;
let rightCount = 0;
let triedCount = 0;

// 取得最大公因數 (保證互質用)
function gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { let t = b; b = a % b; a = t; }
  return a;
}

// 產生亂數整數 [min, max]
function R(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// 反轉不等號方向 (除以負數時使用)
function flipOp(op) {
  if (op === '>') return '<';
  if (op === '<') return '>';
  if (op === '≧') return '≦';
  if (op === '≦') return '≧';
  return op;
}

// 格式化一次式 LaTeX: ax+b
function formatLinearTerm(a, b) {
  let str = '';
  if (a === 1) str += 'x';
  else if (a === -1) str += '-x';
  else str += `${a}x`;
  
  if (b > 0) str += `+${b}`;
  else if (b < 0) str += `${b}`;
  return str;
}

// 格式化因式 LaTeX: (x-r)
function formatFactor(r) {
  if (r === 0) return 'x';
  if (r > 0) return `(x-${r})`;
  return `(x+${-r})`;
}

// --- 題目生成器 ---

// 1. 生成一次不等式
function generateLinear() {
  let a, b;
  while (true) {
    a = R(-9, 9);
    b = R(-9, 9);
    if (a === 0 || b === 0) continue;
    // 降低 |a| = 1 的機率 (約 70% 機率重新骰)
    if (Math.abs(a) === 1 && Math.random() < 0.7) continue;
    // 必須互質
    if (gcd(a, b) !== 1) continue;
    break;
  }

  const opIdx = R(0, 3);
  const opStr = ops[opIdx];
  const latexStr = formatLinearTerm(a, b) + ` ${latexOps[opIdx]} 0`;

  // 計算解答: ax + b op 0 => ax op -b
  let num = -b;
  let den = a;
  let ansOp = opStr;
  
  if (den < 0) {
    ansOp = flipOp(opStr);
    num = -num;
    den = -den;
  }

  // 因為 a,b 互質，不需要再約分
  let fractionStr = (den === 1) ? `${num}` : `${num}/${den}`;
  
  let ans1 = `x${ansOp}${fractionStr}`;
  let ans2 = `${fractionStr}${flipOp(ansOp)}x`; // 容許反向寫法，如 5/3<x

  return { latex: latexStr, answers: [ans1, ans2] };
}

// 2. 生成二次不等式
function generateQuadratic() {
  let r1, r2;
  while (true) {
    r1 = R(-9, 9);
    r2 = R(-9, 9);
    if (r1 !== r2) break;
  }
  if (r1 > r2) [r1, r2] = [r2, r1]; // 確保 r1 < r2

  const opIdx = R(0, 3);
  const opStr = ops[opIdx];
  
  // 組裝 LaTeX，若有 0 (即 x)，習慣放前面
  let factors = [];
  if (r1 === 0) factors = ['x', formatFactor(r2)];
  else if (r2 === 0) factors = ['x', formatFactor(r1)];
  else {
    // 隨機對調兩個括號的順序
    if (Math.random() > 0.5) factors = [formatFactor(r1), formatFactor(r2)];
    else factors = [formatFactor(r2), formatFactor(r1)];
  }
  const latexStr = factors.join('') + ` ${latexOps[opIdx]} 0`;

  let validAns = [];
  if (opStr === '>') {
    validAns.push(`x>${r2}或x<${r1}`);
    validAns.push(`x<${r1}或x>${r2}`);
  } else if (opStr === '<') {
    validAns.push(`${r1}<x<${r2}`);
    validAns.push(`${r2}>x>${r1}`);
    validAns.push(`x>${r1}且x<${r2}`);
    validAns.push(`x<${r2}且x>${r1}`);
  } else if (opStr === '≧') {
    validAns.push(`x≧${r2}或x≦${r1}`);
    validAns.push(`x≦${r1}或x≧${r2}`);
  } else if (opStr === '≦') {
    validAns.push(`${r1}≦x≦${r2}`);
    validAns.push(`${r2}≧x≧${r1}`);
    validAns.push(`x≧${r1}且x≦${r2}`);
    validAns.push(`x≦${r2}且x≧${r1}`);
  }

  return { latex: latexStr, answers: validAns };
}

// --- 介面與事件控制 ---

const elDisplay = document.getElementById('input-display');
const elMsg = document.getElementById('msg');
const elScore = document.getElementById('score');

function renderLatex(elementId, mathStr) {
  katex.render(mathStr, document.getElementById(elementId), { throwOnError: false, displayMode: true });
}

function nextQuestion() {
  isDone = false;
  elDisplay.innerText = '';
  elMsg.innerText = '';
  elMsg.className = '';
  
  // 隨機決定要出一次還是二次不等式
  const qData = (Math.random() < 0.5) ? generateLinear() : generateQuadratic();
  
  currentValidAnswers = qData.answers;
  renderLatex('question-display', qData.latex);
}

function checkAnswer() {
  if (isDone) { nextQuestion(); return; }
  
  const userInput = elDisplay.innerText.trim();
  if (!userInput) return;

  triedCount++;
  
  if (currentValidAnswers.includes(userInput)) {
    rightCount++;
    isDone = true;
    elMsg.innerText = '答對了！按 Enter 下一題';
    elMsg.className = 'ok';
  } else {
    elMsg.innerText = '再檢查看看，或是格式不符。';
    elMsg.className = 'bad';
  }
  
  elScore.innerText = `答對 ${rightCount} / 已作答 ${triedCount}`;
}

// 按鈕事件綁定
document.getElementById('pad').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  const key = btn.dataset.k;

  if (key === 'enter') {
    checkAnswer();
  } else if (key === 'back') {
    elDisplay.innerText = elDisplay.innerText.slice(0, -1);
  } else {
    if (isDone) return; // 答對後鎖定輸入
    let val = key;
    if (val === '-') val = '-'; // 統一減號
    elDisplay.innerText += val;
  }
});

// 支援實體鍵盤操作
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') {
    ev.preventDefault();
    checkAnswer();
  } else if (ev.key === 'Backspace') {
    ev.preventDefault();
    elDisplay.innerText = elDisplay.innerText.slice(0, -1);
  } else {
    if (isDone) return;
    const allowed = "0123456789x/<>=-";
    if (allowed.includes(ev.key)) {
      ev.preventDefault();
      // 將標準實體鍵盤的 = 轉換
      let char = ev.key;
      if (char === '=') return; // 防誤觸，強迫使用按鈕的 <= 或 >=
      elDisplay.innerText += char;
    }
  }
});

// 初始化第一題
window.onload = nextQuestion;

</script>
</body>
</html>
